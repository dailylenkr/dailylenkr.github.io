<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'none'; worker-src 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>데일리 레노버</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="데일리 레노버">
<meta property="og:title" content="데일리 레노버">
<meta property="og:description" content="매일 아침, 사업부별 레노버 브리핑">
<meta property="og:url" content="https://dailylenkr.github.io/">
<meta property="og:image" content="https://dailylenkr.github.io/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="매일 아침, 사업부별 레노버 브리핑">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/app.css">
<script type="module" src="assets/app.js"></script>
</head>
<body>
<div id="lock" class="lock">
  <div class="lock-card">
    <div class="brand"><span class="logo">DL</span><span class="brand-name">데일리 레노버</span></div>
    <div>
      <h1 class="lock-title">비밀번호를 입력하세요</h1>
      <p class="muted">허용된 사용자만 볼 수 있는 페이지입니다.</p>
    </div>
    <div class="field">
      <label for="pw" class="field-label">비밀번호</label>
      <div class="pw-box" id="pwBox">
        <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="비밀번호">
        <button type="button" id="pwToggle" class="icon-btn" aria-label="비밀번호 보기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <div id="pwError" class="error" role="alert" hidden></div>
    </div>
    <button type="button" id="unlock" class="btn-primary">들어가기</button>
    <div class="lock-foot">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      내용은 암호화되어 있으며 이 브라우저 안에서만 풀립니다. 아무것도 저장하지 않습니다.
    </div>
  </div>
</div>
<div id="app" hidden></div>
<noscript><p class="noscript">이 페이지는 자바스크립트가 필요합니다.</p></noscript>
</body>
</html>
