name: Set up or change password

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create keys or re-seal with new password
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_PASSWORD_OLD: ${{ secrets.SITE_PASSWORD_OLD }}
        run: node scripts/setup-keys.mjs
      - name: Commit key files
        run: |
          git config user.name "dailylenkr-bot"
          git config user.email "dailylenkr-bot@users.noreply.github.com"
          git add data/keys
          if git diff --cached --quiet; then echo "No key changes."; exit 0; fi
          git commit -m "Update encrypted key files"
          git push
